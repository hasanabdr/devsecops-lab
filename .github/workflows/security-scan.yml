# devsecops-lab reusable security pipeline
#
# Caller contract: the calling repository must have, at its root:
#   - a Dockerfile (built as the image scanned by Trivy and targeted by ZAP)
#   - a sonar-project.properties (consumed by the SonarQube scan)
# See docs/devsecops-lab.md, "Reusable Workflow Architecture" / "Onboarding a New
# Repository", for the full contract, inputs/secrets reference, and versioning policy.
#
# Changelog:
#   v1 - initial reusable workflow. Converts the former repo-local test.yml (SAST +
#        Trivy image/fs scan) into workflow_call, and adds OWASP Dependency-Check (SCA)
#        and an OWASP ZAP baseline scan (DAST) as new jobs.
#   unreleased - adds optional `dast_env` input (default "", backward-compatible):
#        newline-delimited KEY=VALUE pairs injected into the ephemeral DAST container
#        via `-e`. Needed by callers whose app crash-loops without required boot-time
#        env vars (e.g. a JWT secret), since this job previously passed none.

name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name/tag base. Defaults to the calling repository's name."
        type: string
        default: ""
      app_context:
        description: "Docker build context directory, relative to the repo root."
        type: string
        default: "."
      app_port:
        description: "Port the application listens on inside its container (used as the DAST target). Only meaningful when enable_dast is true."
        type: number
        default: 8080
      dast_env:
        description: >-
          Newline-separated KEY=VALUE pairs injected into the ephemeral DAST
          container, for apps that refuse to start without configuration.
          PLACEHOLDER VALUES ONLY -- workflow_call inputs are echoed into the run
          log in plaintext, so never pass a real secret here. Anything genuinely
          sensitive belongs in the secrets block instead.
        type: string
        default: ""
      zap_target_path:
        description: "URL path the OWASP ZAP baseline scan targets."
        type: string
        default: "/"
      health_check_path:
        description: "URL path polled to confirm the container is ready before ZAP runs."
        type: string
        default: "/"
      health_check_timeout_seconds:
        description: "Max seconds to wait for the container to become healthy before failing the DAST job."
        type: number
        default: 60
      dependency_check_project_name:
        description: "Project name recorded in the Dependency-Check report. Defaults to the calling repository's full name."
        type: string
        default: ""
      runner_labels:
        description: 'JSON array of runner labels to target, e.g. ["self-hosted","linux","lab"].'
        type: string
        default: '["self-hosted","linux","lab"]'
      enable_sast:
        description: "Run the SonarQube SAST job."
        type: boolean
        default: true
      enable_build_scan:
        description: "Run the Docker build + Trivy image/filesystem scan job."
        type: boolean
        default: true
      enable_dependency_check:
        description: "Run the OWASP Dependency-Check SCA job."
        type: boolean
        default: true
      enable_dast:
        description: "Run the OWASP ZAP baseline DAST job (implies the build job also runs)."
        type: boolean
        default: true
      dast_env:
        description: "Newline-delimited KEY=VALUE pairs injected into the ephemeral app container via -e. Lets apps with required boot-time env vars (e.g. a JWT secret or DB URL) pass their health check under DAST without needing live dependencies."
        type: string
        default: ""
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      NVD_API_KEY:
        required: false

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast:
    name: SAST - SonarQube
    if: inputs.enable_sast
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  dependency-check:
    name: SCA - OWASP Dependency-Check
    if: inputs.enable_dependency_check
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    # Fail fast rather than sitting for 6h on the default timeout. A cold NVD
    # sync takes ~25min; anything past this is stuck, not slow.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Resolve project name
        id: vars
        run: |
          NAME="${{ inputs.dependency_check_project_name }}"
          echo "project_name=${NAME:-${{ github.repository }}}" >> "$GITHUB_OUTPUT"

      - name: Clear orphaned Dependency-Check containers
        run: |
          # Cancelling or timing out a job does NOT stop containers the job
          # spawned (the runner unit uses KillMode=process, and containers are
          # children of dockerd regardless). A survivor keeps holding the H2
          # write lock on the shared cache volume, so every later run dies with
          # "Unable to obtain an exclusive lock on the H2 database". Sweep first.
          docker ps -aq --filter "label=devsecops-scanner=dependency-check" | xargs -r docker rm -f

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p "${{ github.workspace }}/reports"
          # --log is load-bearing: the tool writes [INFO] progress to stdout,
          # which the runner block-buffers and discards on failure, leaving only
          # stderr [WARN]/[ERROR]. The log file is the only reliable record of
          # what actually happened, so it is always uploaded as an artifact.
          ARGS=(--scan /src --format SARIF --format HTML --out /src/reports \
                --project "${{ steps.vars.outputs.project_name }}" --failOnCVSS 11 \
                --log /src/reports/dependency-check.log)
          if [ -n "$NVD_API_KEY" ]; then
            ARGS+=(--nvdApiKey "$NVD_API_KEY")
          fi
          # GID 0, not "$(id -g)": the image's data directory is owned by uid 1000
          # group 0, mode 775, so it is writable by any UID that is in group 0 --
          # the standard arbitrary-UID container pattern. Passing the caller's own
          # GID instead only works by luck when the caller happens to be uid 1000,
          # and otherwise fails as an unwritable H2 database much later on.
          docker run --rm \
            --label devsecops=ephemeral \
            --label devsecops-scanner=dependency-check \
            --name "dependency-check-${{ github.run_id }}-${{ github.run_attempt }}" \
            --user "$(id -u):0" \
            -v "${{ github.workspace }}:/src" \
            -v dependency-check-nvd-cache:/usr/share/dependency-check/data \
            owasp/dependency-check:12.1.0 \
            "${ARGS[@]}"

      - name: Stop Dependency-Check container
        if: always()
        run: docker rm -f "dependency-check-${{ github.run_id }}-${{ github.run_attempt }}" 2>/dev/null || true

      # Code scanning needs GitHub Advanced Security on private repos, which free
      # orgs do not have. Skip the upload there rather than failing the job, and
      # rely on the SARIF being attached as a build artifact below instead.
      # continue-on-error covers the remaining cases (GHAS disabled, event payload
      # without repository info) so a publishing problem never fails a scan.
      - name: Upload Dependency-Check results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98
        if: always() && !github.event.repository.private
        continue-on-error: true
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check

      - name: Upload Dependency-Check report, log and SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-check-report-${{ github.sha }}
          path: |
            reports/dependency-check-report.html
            reports/dependency-check-report.sarif
            reports/dependency-check.log
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build and Trivy Scan
    if: inputs.enable_build_scan || inputs.enable_dast
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Resolve image name
        id: vars
        run: |
          NAME="${{ inputs.image_name }}"
          NAME="${NAME:-$(basename '${{ github.repository }}')}"
          echo "image_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$NAME:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build -t "${{ steps.vars.outputs.image_tag }}" "${{ inputs.app_context }}"
          docker tag "${{ steps.vars.outputs.image_tag }}" "${{ steps.vars.outputs.image_name }}:latest"

      - name: Save image to tar
        run: |
          mkdir -p "${{ github.workspace }}/tmp"
          rm -f "${{ github.workspace }}/tmp/image.tar"
          docker save "${{ steps.vars.outputs.image_tag }}" -o "${{ github.workspace }}/tmp/image.tar"

      - name: Trivy - Scan image for CVEs
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tmp/image.tar:${{ github.workspace }}/tmp/image.tar \
            -v $HOME/.cache/trivy:/root/.cache/trivy \
            -v ${{ github.workspace }}:/workspace \
            aquasec/trivy:0.72.0 image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output /workspace/trivy-image.sarif \
            --input ${{ github.workspace }}/tmp/image.tar

      - name: Trivy - Scan repo files
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v $HOME/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy:0.72.0 fs \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output /workspace/trivy-fs.sarif \
            /workspace

      # See the note in the dependency-check job: private repos on a free org have
      # no code scanning, so publishing is skipped there and the SARIF is attached
      # as an artifact instead.
      - name: Upload Trivy image results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98
        if: always() && !github.event.repository.private
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload Trivy fs results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98
        if: always() && !github.event.repository.private
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy SARIF reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: trivy-reports-${{ github.sha }}
          path: |
            trivy-image.sarif
            trivy-fs.sarif
          if-no-files-found: warn
          retention-days: 30

  dast:
    name: DAST - OWASP ZAP Baseline
    if: inputs.enable_dast
    needs: build
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    steps:
      - name: Start application container
        env:
          # Passed through env, NOT interpolated into the script body: a caller of
          # this reusable workflow must not be able to inject shell into a job
          # running on the self-hosted runner.
          DAST_ENV: ${{ inputs.dast_env }}
        run: |
          ENV_ARGS=()
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            ENV_ARGS+=(-e "$line")
          done <<< "$DAST_ENV"

          docker run -d --rm \
            --label devsecops=ephemeral \
            --name "zap-target-${{ github.run_id }}-${{ github.run_attempt }}" \
            -p 127.0.0.1::${{ inputs.app_port }} \
            "${ENV_ARGS[@]}" \
            "${{ needs.build.outputs.image_tag }}"

      - name: Show container startup logs
        if: always()
        run: |
          # An app that exits on missing configuration otherwise surfaces only as
          # an opaque health-check timeout 60s later, with no reason given.
          docker logs "zap-target-${{ github.run_id }}-${{ github.run_attempt }}" 2>&1 | tail -30 || true

      - name: Resolve published port
        id: port
        run: |
          MAPPED=$(docker port "zap-target-${{ github.run_id }}-${{ github.run_attempt }}" ${{ inputs.app_port }} | head -n1 | cut -d: -f2)
          echo "host_port=$MAPPED" >> "$GITHUB_OUTPUT"

      - name: Wait for application to become healthy
        run: |
          DEADLINE=$((SECONDS + ${{ inputs.health_check_timeout_seconds }}))
          URL="http://localhost:${{ steps.port.outputs.host_port }}${{ inputs.health_check_path }}"
          until curl -sf -o /dev/null "$URL"; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "Timed out waiting for $URL to become healthy" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Prepare report directory
        run: |
          mkdir -p "${{ github.workspace }}/zap-reports"
          # The zaproxy image runs as its own `zap` user (uid 1000), which will not
          # match the runner's UID, so it cannot write into a directory the runner
          # just created. zap-baseline.py also refuses to emit file-based reports
          # unless /zap/wrk is a real mount, so writing inside the container and
          # copying out afterwards is not an option -- the mount is mandatory and
          # the mounted directory has to be writable by an unknown UID.
          # Scoped to this ephemeral, per-run directory, which git clean removes.
          chmod 777 "${{ github.workspace }}/zap-reports"

      - name: OWASP ZAP baseline scan
        run: |
          # -I keeps findings from failing the job, matching the report-only
          # posture of every other scanner here. It also means ZAP exits 0 even if
          # it never ran, so the next step verifies a report was actually produced.
          docker run --rm --network host \
            --label devsecops=ephemeral \
            --name "zap-scan-${{ github.run_id }}-${{ github.run_attempt }}" \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "http://localhost:${{ steps.port.outputs.host_port }}${{ inputs.zap_target_path }}" \
            -r zap-report.html -J zap-report.json -w zap-report.md -I

      - name: Verify ZAP produced a report
        run: |
          if [ ! -s "${{ github.workspace }}/zap-reports/zap-report.html" ]; then
            echo "::error::ZAP produced no report -- the scan did not run. Findings are report-only, but a scan that never executed must not pass as green." >&2
            ls -la "${{ github.workspace }}/zap-reports" || true
            exit 1
          fi
          echo "ZAP reports present:"
          ls -la "${{ github.workspace }}/zap-reports"

      - name: Upload ZAP reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: zap-report-${{ github.sha }}
          path: zap-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Stop application container
        if: always()
        run: docker stop "zap-target-${{ github.run_id }}-${{ github.run_attempt }}" || true

  cleanup:
    name: Cleanup ephemeral containers
    if: always()
    needs: [build, dast]
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    steps:
      - name: Remove ephemeral containers and prune old images
        run: |
          docker ps -aq --filter "label=devsecops=ephemeral" | xargs -r docker rm -f
          docker image prune -f --filter "until=24h"
