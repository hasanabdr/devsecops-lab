name: Test Runner

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test runner
        run: |
          echo "Runner is working"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          docker --version
          docker compose version
